<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五金产品销售管理系统 - 店主端</title>
    <link rel="icon" href="../../images/basic/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/console.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>(function(){var u;try{u=JSON.parse(localStorage.getItem('loginUser')||'{}');}catch(e){u={};}if(!u.token||u.roleId!==0){window.location.href='../../index.html';}}());</script>
    <style>
        .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
        .stat-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .15s,box-shadow .15s}
        .stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
        .stat-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
        .stat-icon.green{background:#e8f7ea;color:#2e7d32}
        .stat-icon.blue{background:#f0f9ff;color:#2563eb}
        .stat-icon.orange{background:#fef3c7;color:#d48806}
        .stat-icon.purple{background:#fcf1f7;color:#9333ea}
        .stat-info h3{font-size:26px;font-weight:700;color:#111827;margin:0;line-height:1.2}
        .stat-info p{font-size:13px;color:#6b7280;margin:2px 0 0}
        .loading-row td{text-align:center;color:#9ca3af;padding:32px}
        .search-wrap{position:relative}
        .search-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50;max-height:360px;overflow-y:auto;margin-top:4px}
        .search-dropdown.show{display:block}
        .sd-group-title{padding:8px 14px;font-size:12px;font-weight:600;color:#6b7280;background:#f9fafb;border-bottom:1px solid #f3f4f6}
        .sd-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f8f9fb;display:flex;justify-content:space-between;align-items:center}
        .sd-item:hover{background:#f0f9ff}
        .sd-item:last-child{border-bottom:none}
        .sd-empty{padding:20px;text-align:center;color:#9ca3af;font-size:13px}
        .sd-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
    </style>
</head>
<body>
<div class="layout">
    <div class="sidebar">
        <div class="brand">
            <div class="brand-title">五金产品销售管理系统</div>
            <div class="brand-sub">店主端</div>
        </div>
        <div class="nav">
            <a href="owner_console.html" class="nav-item active"><i class="fas fa-tachometer-alt nav-ico"></i><span class="nav-text">控制台首页</span></a>
            <a href="product_manager.html" class="nav-item"><i class="fas fa-box nav-ico"></i><span class="nav-text">商品管理</span></a>
            <a href="inventory_manager.html" class="nav-item"><i class="fas fa-warehouse nav-ico"></i><span class="nav-text">库存管理</span></a>
            <a href="order_manager.html" class="nav-item"><i class="fas fa-shopping-cart nav-ico"></i><span class="nav-text">订单管理</span></a>
            <a href="user_manager.html" class="nav-item"><i class="fas fa-users nav-ico"></i><span class="nav-text">用户管理</span></a>
            <a href="data_analysis.html" class="nav-item"><i class="fas fa-chart-line nav-ico"></i><span class="nav-text">数据统计</span></a>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h1 class="page-title">控制台首页</h1>
            <div class="topbar-right">
                <div class="search search-wrap">
                    <input type="text" id="globalSearch" placeholder="搜索订单号、商品名称、用户..." autocomplete="off">
                    <div class="search-dropdown" id="searchDropdown"></div>
                </div>
                <a href="owner_profile.html" class="user-info" style="text-decoration:none;color:inherit;cursor:pointer;" title="个人信息">
                    <span id="adminName" style="margin-right: 10px;">管理员</span>
                    <img id="adminAvatar" src="../../images/avatar/default.png" alt="头像" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                </a>
            </div>
        </div>

        <div class="content">
            <!-- 统计卡片 -->
            <div class="stat-cards">
                <div class="stat-card" onclick="window.location.href='order_manager.html'">
                    <div class="stat-icon green"><i class="fas fa-yen-sign"></i></div>
                    <div class="stat-info">
                        <h3 id="todaySales">-</h3>
                        <p>今日销售额</p>
                    </div>
                </div>
                <div class="stat-card" onclick="window.location.href='order_manager.html'">
                    <div class="stat-icon blue"><i class="fas fa-clock"></i></div>
                    <div class="stat-info">
                        <h3 id="pendingOrderCount">-</h3>
                        <p>待处理订单</p>
                    </div>
                </div>
                <div class="stat-card" onclick="window.location.href='inventory_manager.html'">
                    <div class="stat-icon orange"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="stat-info">
                        <h3 id="warningStockCount">-</h3>
                        <p>库存预警商品</p>
                    </div>
                </div>
                <div class="stat-card" onclick="window.location.href='user_manager.html'">
                    <div class="stat-icon purple"><i class="fas fa-users"></i></div>
                    <div class="stat-info">
                        <h3 id="userCount">-</h3>
                        <p>注册用户数</p>
                    </div>
                </div>
            </div>

            <!-- 最近订单 -->
            <div class="panel">
                <div class="toolbar">
                    <h2 style="margin:0;font-size:16px;font-weight:700;">
                        <i class="fas fa-clock" style="color:#2563eb;margin-right:6px;"></i>最近订单
                    </h2>
                    <a href="order_manager.html" class="btn btn-primary"><i class="fas fa-list btn-ico"></i> 查看全部</a>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr>
                            <th>订单号</th><th>下单人</th><th>订单金额</th>
                            <th>交易类型</th><th>支付状态</th><th>下单时间</th><th>操作</th>
                        </tr></thead>
                        <tbody id="recentOrderTbody">
                            <tr class="loading-row"><td colspan="7"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 库存预警 -->
            <div class="panel">
                <div class="toolbar">
                    <h2 style="margin:0;font-size:16px;font-weight:700;">
                        <i class="fas fa-exclamation-triangle" style="color:#d48806;margin-right:6px;"></i>库存预警商品
                    </h2>
                    <a href="inventory_manager.html" class="btn btn-primary"><i class="fas fa-warehouse btn-ico"></i> 库存管理</a>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr>
                            <th>规格编码</th><th>商品名称</th><th>规格</th>
                            <th>当前库存</th><th>预警阈值</th><th>操作</th>
                        </tr></thead>
                        <tbody id="warningStockTbody">
                            <tr class="loading-row"><td colspan="6"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../../js/jquery-3.7.1.min.js"></script>
<script>
var loginUser = {};
try { loginUser = JSON.parse(localStorage.getItem('loginUser') || '{}'); } catch(e) {}
var TOKEN = loginUser.token || '';

function H() { return { 'Authorization': 'Bearer ' + TOKEN }; }

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(t) {
    if (!t) return '-';
    return new Date(t).toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-');
}

// ========== 顶栏用户信息 ==========
function loadAdminInfo() {
    $('#adminName').text(loginUser.username || '管理员');
    var av = loginUser.avatar || '';
    if (av.startsWith('./')) av = av.replace('./', '../../');
    if (av.startsWith('/images/')) av = '../..' + av;
    if (av) $('#adminAvatar').attr('src', av);
}

// ========== 加载统计数据 ==========
function loadStats() {
    // 待处理订单（待支付+待发货）
    var p0 = $.ajax({ url: '/api/v1/order/list', type: 'GET', headers: H(), data: { pageNum:1, pageSize:1, payStatus:0 }});
    var p4 = $.ajax({ url: '/api/v1/order/list', type: 'GET', headers: H(), data: { pageNum:1, pageSize:1, payStatus:4 }});
    $.when(p0, p4).done(function(r0, r4) {
        var count = 0;
        if (r0[0].code === 200) count += r0[0].data.total || 0;
        if (r4[0].code === 200) count += r4[0].data.total || 0;
        $('#pendingOrderCount').text(count);
    }).fail(function() { $('#pendingOrderCount').text('0'); });

    // 库存预警
    $.ajax({
        url: '/api/v1/inventory/stock/list', type: 'GET', headers: H(),
        data: { pageNum:1, pageSize:1, warnOnly:true },
        success: function(r) { $('#warningStockCount').text(r.code === 200 ? (r.data.total || 0) : '0'); },
        error: function() { $('#warningStockCount').text('0'); }
    });

    // 用户数
    $.ajax({
        url: '/api/v1/user/consumer/list', type: 'GET', headers: H(),
        data: { pageNum:1, pageSize:1 },
        success: function(r) { $('#userCount').text(r.code === 200 ? (r.data.total || 0) : '0'); },
        error: function() { $('#userCount').text('0'); }
    });

    // 今日销售额 - 通过统计接口或从订单计算
    $.ajax({
        url: '/api/v1/order/list', type: 'GET', headers: H(),
        data: { pageNum:1, pageSize:100, payStatus:1 },
        success: function(r) {
            if (r.code === 200) {
                var today = new Date().toISOString().substring(0, 10);
                var total = 0;
                (r.data.records || []).forEach(function(o) {
                    var d = (o.createTime || '').substring(0, 10);
                    if (d === today) total += Number(o.orderAmount || 0);
                });
                $('#todaySales').text('¥' + total.toFixed(0));
            } else {
                $('#todaySales').text('¥0');
            }
        },
        error: function() { $('#todaySales').text('¥0'); }
    });
}

// ========== 加载最近订单 ==========
function loadRecentOrders() {
    $.ajax({
        url: '/api/v1/order/list', type: 'GET', headers: H(),
        data: { pageNum:1, pageSize:5 },
        success: function(r) {
            if (r.code !== 200) {
                $('#recentOrderTbody').html('<tr class="loading-row"><td colspan="7" style="color:#ef4444;">加载失败</td></tr>');
                return;
            }
            renderRecentOrders(r.data.records || []);
        },
        error: function() {
            $('#recentOrderTbody').html('<tr class="loading-row"><td colspan="7" style="color:#ef4444;">加载失败</td></tr>');
        }
    });
}

var STATUS_MAP = {0:'待支付',1:'已支付',2:'已取消',3:'已退款',4:'待发货',5:'已发货',6:'已完成'};
var STATUS_CLASS = {0:'tag-wait',1:'tag-on',2:'tag-off',3:'tag-off',4:'tag-wait',5:'tag-on',6:'tag-on'};
var TRADE_TYPE = {1:'批发', 2:'零售'};

function renderRecentOrders(orders) {
    if (!orders.length) {
        $('#recentOrderTbody').html('<tr class="loading-row"><td colspan="7" style="color:#10b981;"><i class="fas fa-check-circle" style="margin-right:6px;"></i>暂无订单数据</td></tr>');
        return;
    }
    var h = '';
    orders.forEach(function(o) {
        h += '<tr>' +
            '<td style="font-size:12px;font-weight:600;">' + esc(o.orderId||'-') + '</td>' +
            '<td>' + esc(o.receiverName||'-') + '</td>' +
            '<td style="font-weight:700;">¥' + Number(o.orderAmount||0).toFixed(2) + '</td>' +
            '<td>' + esc(TRADE_TYPE[o.tradeType]||'-') + '</td>' +
            '<td><span class="tag ' + (STATUS_CLASS[o.payStatus]||'') + '">' + (STATUS_MAP[o.payStatus]||'-') + '</span></td>' +
            '<td style="font-size:12px;color:#6b7280;">' + fmtTime(o.createTime) + '</td>' +
            '<td class="ops"><a href="order_manager.html" class="btn btn-edit" style="width:44px;">查看</a></td>' +
        '</tr>';
    });
    $('#recentOrderTbody').html(h);
}

// ========== 加载库存预警 ==========
function loadWarningStock() {
    $.ajax({
        url: '/api/v1/inventory/stock/list', type: 'GET', headers: H(),
        data: { pageNum:1, pageSize:5, warnOnly:true },
        success: function(r) {
            if (r.code !== 200) {
                $('#warningStockTbody').html('<tr class="loading-row"><td colspan="6" style="color:#ef4444;">加载失败</td></tr>');
                return;
            }
            renderWarningStock(r.data.records || []);
        },
        error: function() {
            $('#warningStockTbody').html('<tr class="loading-row"><td colspan="6" style="color:#ef4444;">加载失败</td></tr>');
        }
    });
}

function renderWarningStock(recs) {
    if (!recs.length) {
        $('#warningStockTbody').html('<tr class="loading-row"><td colspan="6" style="color:#10b981;"><i class="fas fa-check-circle" style="margin-right:6px;"></i>库存充足，无预警商品</td></tr>');
        return;
    }
    var h = '';
    recs.forEach(function(r) {
        h += '<tr>' +
            '<td style="font-size:12px;color:#6b7280;">' + esc(r.specCode||'-') + '</td>' +
            '<td style="font-weight:600;">' + esc(r.productName||'-') + '</td>' +
            '<td>' + esc((r.material||'')+' '+(r.size||'')) + '</td>' +
            '<td style="font-weight:700;color:#dc2626;">' + (r.stockQuantity!=null?r.stockQuantity:'-') + '</td>' +
            '<td>' + (r.warningThreshold!=null?r.warningThreshold:'-') + '</td>' +
            '<td class="ops"><a href="inventory_manager.html" class="btn btn-edit" style="width:44px;">补货</a></td>' +
        '</tr>';
    });
    $('#warningStockTbody').html(h);
}

// ========== 全局搜索 ==========
var searchTimer = null;
$('#globalSearch').on('input', function() {
    var kw = $.trim($(this).val());
    if (!kw) { $('#searchDropdown').removeClass('show').empty(); return; }
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ doGlobalSearch(kw); }, 300);
});

$('#globalSearch').on('keypress', function(e) {
    if (e.which === 13) {
        var kw = $.trim($(this).val());
        if (kw) window.location.href = 'order_manager.html?search=' + encodeURIComponent(kw);
    }
});

function doGlobalSearch(kw) {
    var $drop = $('#searchDropdown');
    $drop.html('<div class="sd-empty"><i class="fas fa-spinner fa-spin"></i> 搜索中...</div>').addClass('show');

    var pOrder = $.ajax({ url:'/api/v1/order/list', type:'GET', headers:H(), data:{pageNum:1,pageSize:3,keyword:kw} });
    var pProduct = $.ajax({ url:'/api/v1/product/list', type:'GET', headers:H(), data:{pageNum:1,pageSize:3,keyword:kw} });
    var pStock = $.ajax({ url:'/api/v1/inventory/stock/list', type:'GET', headers:H(), data:{pageNum:1,pageSize:3,keyword:kw} });

    $.when(pOrder, pProduct, pStock).done(function(rO, rP, rS) {
        var html = '';
        var hasResults = false;

        var orders = (rO[0].code===200 && rO[0].data.records) ? rO[0].data.records : [];
        if (orders.length) {
            hasResults = true;
            html += '<div class="sd-group-title"><i class="fas fa-shopping-cart" style="margin-right:6px;"></i>订单</div>';
            orders.forEach(function(o) {
                html += '<div class="sd-item" onclick="window.location.href=\'order_manager.html\'">' +
                    '<span><b>' + esc(o.orderId) + '</b> - ' + esc(o.receiverName||'') + '</span>' +
                    '<span class="sd-tag" style="background:#fff7ed;color:#ea580c;">¥'+Number(o.orderAmount||0).toFixed(2)+'</span>' +
                '</div>';
            });
        }

        var products = (rP[0].code===200 && rP[0].data.records) ? rP[0].data.records : [];
        if (products.length) {
            hasResults = true;
            html += '<div class="sd-group-title"><i class="fas fa-box" style="margin-right:6px;"></i>商品</div>';
            products.forEach(function(p) {
                html += '<div class="sd-item" onclick="window.location.href=\'product_manager.html\'">' +
                    '<span><b>' + esc(p.productName) + '</b>' + (p.brand ? ' - '+esc(p.brand) : '') + '</span>' +
                    '<span class="sd-tag" style="background:'+(p.isOnSale===1?'#d1fae5;color:#065f46':'#f3f4f6;color:#6b7280')+'">'+(p.isOnSale===1?'已上架':'未上架')+'</span>' +
                '</div>';
            });
        }

        var stocks = (rS[0].code===200 && rS[0].data.records) ? rS[0].data.records : [];
        if (stocks.length) {
            hasResults = true;
            html += '<div class="sd-group-title"><i class="fas fa-warehouse" style="margin-right:6px;"></i>库存</div>';
            stocks.forEach(function(s) {
                var warnStyle = s.isWarning ? 'background:#fef2f2;color:#dc2626;' : 'background:#d1fae5;color:#065f46;';
                html += '<div class="sd-item" onclick="window.location.href=\'inventory_manager.html\'">' +
                    '<span><b>' + esc(s.specCode||'-') + '</b> - ' + esc(s.productName||'-') + '</span>' +
                    '<span class="sd-tag" style="'+warnStyle+'">库存:'+s.stockQuantity+'</span>' +
                '</div>';
            });
        }

        if (!hasResults) html = '<div class="sd-empty">未找到相关结果</div>';
        $drop.html(html);
    }).fail(function() {
        $drop.html('<div class="sd-empty" style="color:#ef4444;">搜索失败，请重试</div>');
    });
}

$(document).on('click', function(e) {
    if (!$(e.target).closest('.search-wrap').length) {
        $('#searchDropdown').removeClass('show');
    }
});

// ========== 初始化 ==========
$(function() {
    loadAdminInfo();
    loadStats();
    loadRecentOrders();
    loadWarningStock();
});
</script>
</body>
</html>
