<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五金产品销售管理系统 - 商品管理</title>
    <link rel="icon" href="../../images/basic/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/console.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>(function(){var u;try{u=JSON.parse(localStorage.getItem('loginUser')||'{}');}catch(e){u={};}if(!u.token||u.roleId!==0){window.location.href='../../index.html';}}());</script>
    <style>
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal{background:#fff;border-radius:12px;padding:28px;width:540px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
        .modal-title{font-size:18px;font-weight:700;margin:0 0 20px;color:#111827}
        .form-row{margin-bottom:14px}
        .form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
        .form-input{width:100%;height:38px;padding:0 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box}
        .form-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
        .form-textarea{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;resize:vertical;min-height:80px;outline:none;box-sizing:border-box}
        .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
        .btn-cancel-modal{background:#f3f4f6;color:#374151;border:none;border-radius:8px;padding:9px 20px;cursor:pointer;font-size:14px}
        .pagination{padding:16px;text-align:right}
        .page-btn{min-width:34px;height:34px;padding:0 8px;border-radius:8px;border:1px solid #e5eaf3;background:#fff;cursor:pointer;font-size:13px;margin:0 2px}
        .page-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
        .page-btn:disabled{opacity:.5;cursor:not-allowed}
        .loading-row td{text-align:center;color:#9ca3af;padding:40px}
        .search-wrap{position:relative}
        .search-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50;max-height:360px;overflow-y:auto;margin-top:4px}
        .search-dropdown.show{display:block}
        .sd-group-title{padding:8px 14px;font-size:12px;font-weight:600;color:#6b7280;background:#f9fafb;border-bottom:1px solid #f3f4f6}
        .sd-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f8f9fb;display:flex;justify-content:space-between;align-items:center}
        .sd-item:hover{background:#f0f9ff}
        .sd-empty{padding:20px;text-align:center;color:#9ca3af;font-size:13px}
        .sd-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
    </style>
</head>
<body>
<div class="layout">
    <div class="sidebar">
        <div class="brand">
            <div class="brand-title">五金产品销售管理系统</div>
            <div class="brand-sub">店主端</div>
        </div>
        <div class="nav">
            <a href="owner_console.html" class="nav-item"><i class="fas fa-tachometer-alt nav-ico"></i><span class="nav-text">控制台首页</span></a>
            <a href="product_manager.html" class="nav-item active"><i class="fas fa-box nav-ico"></i><span class="nav-text">商品管理</span></a>
            <a href="inventory_manager.html" class="nav-item"><i class="fas fa-warehouse nav-ico"></i><span class="nav-text">库存管理</span></a>
            <a href="order_manager.html" class="nav-item"><i class="fas fa-shopping-cart nav-ico"></i><span class="nav-text">订单管理</span></a>
            <a href="user_manager.html" class="nav-item"><i class="fas fa-users nav-ico"></i><span class="nav-text">用户管理</span></a>
            <a href="data_analysis.html" class="nav-item"><i class="fas fa-chart-line nav-ico"></i><span class="nav-text">数据统计</span></a>
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <h1 class="page-title">商品管理</h1>
            <div class="topbar-right">
                <div class="search search-wrap">
                    <input type="text" id="globalSearch" placeholder="搜索商品名称、品牌、型号..." autocomplete="off">
                    <div class="search-dropdown" id="searchDropdown"></div>
                </div>
                <a href="owner_profile.html" class="user-info" style="text-decoration:none;color:inherit;cursor:pointer;" title="个人信息">
                    <span id="adminName" style="margin-right:10px;font-size:14px;">管理员</span>
                    <img id="adminAvatar" src="../../images/avatar/default.png" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                </a>
            </div>
        </div>

        <div class="content">
            <div class="panel">
                <div class="toolbar" style="justify-content:space-between;flex-wrap:wrap;gap:10px;">
                    <div style="display:flex;gap:10px;">
                        <button class="btn btn-primary" id="btnAdd"><i class="fas fa-plus btn-ico"></i> 新增商品</button>
                    </div>
                    <div class="filter" style="flex-wrap:wrap;gap:8px;">
                        <span>分类：</span>
                        <select class="select" id="filterCategory"><option value="">全部分类</option></select>
                        <span>状态：</span>
                        <select class="select" id="filterStatus">
                            <option value="">全部状态</option>
                            <option value="1">已上架</option>
                            <option value="0">未上架</option>
                        </select>
                        <button class="btn btn-primary" id="btnFilter"><i class="fas fa-search"></i> 筛选</button>
                        <button class="btn" style="background:#f3f4f6;color:#374151;" id="btnReset">重置</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr>
                            <th style="width:80px;">ID</th><th style="width:100px;">图片</th><th style="width:180px;">名称</th>
                            <th style="width:160px;">分类</th><th style="width:100px;">品牌</th><th style="width:80px;">规格数</th>
                            <th style="width:120px;">价格范围</th><th style="width:80px;">总库存</th><th style="width:90px;">上架状态</th>
                            <th style="width:150px;">创建时间</th><th style="width:130px;">操作</th>
                        </tr></thead>
                        <tbody id="productTableBody">
                            <tr class="loading-row"><td colspan="11"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<!-- 新增商品弹窗 -->
<div class="modal-overlay" id="modalAdd">
    <div class="modal">
        <h3 class="modal-title">新增商品</h3>
        <div class="form-row"><label class="form-label">商品名称 <span style="color:#ef4444;">*</span></label><input class="form-input" id="addProductName" placeholder="请输入商品名称"></div>
        <div class="form-row"><label class="form-label">商品分类 <span style="color:#ef4444;">*</span></label><select class="form-input" id="addCategoryId"><option value="">请选择分类</option></select></div>
        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label class="form-label">品牌</label><input class="form-input" id="addBrand" placeholder="品牌名称"></div>
            <div><label class="form-label">型号</label><input class="form-input" id="addModel" placeholder="型号"></div>
        </div>
        <div class="form-row"><label class="form-label">商品描述</label><textarea class="form-textarea" id="addDescription" placeholder="商品详细描述..."></textarea></div>
        <div class="form-row"><label class="form-label">上架状态</label><select class="form-input" id="addIsOnSale"><option value="1">立即上架</option><option value="0">暂不上架</option></select></div>
        <div class="modal-footer"><button class="btn btn-cancel-modal" id="btnCancelAdd">取消</button><button class="btn btn-primary" id="btnConfirmAdd">确认新增</button></div>
    </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modalDetail">
    <div class="modal" style="width:620px;">
        <h3 class="modal-title">商品详情</h3>
        <div id="detailContent"></div>
        <div class="modal-footer"><button class="btn btn-cancel-modal" id="btnCloseDetail">关闭</button></div>
    </div>
</div>

<script src="../../js/jquery-3.7.1.min.js"></script>
<script>
var loginUser={};try{loginUser=JSON.parse(localStorage.getItem('loginUser')||'{}');}catch(e){}
var TOKEN=loginUser.token||'',currentPage=1,totalPages=1,allLeafCategories=[];
function H(){return{'Authorization':'Bearer '+TOKEN};}
function HJ(){return Object.assign(H(),{'Content-Type':'application/json'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtTime(t){if(!t)return'-';return new Date(t).toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-');}

function loadAdminInfo(){
    $('#adminName').text(loginUser.username||'管理员');
    var av=loginUser.avatar||'';
    if(av.startsWith('./'))av=av.replace('./','../../');
    if(av.startsWith('/images/'))av='../..'+av;
    if(av)$('#adminAvatar').attr('src',av);
}

function flattenCategories(nodes,parentName){
    var r=[];(nodes||[]).forEach(function(n){var fn=parentName?parentName+' > '+n.categoryName:n.categoryName;if(n.children&&n.children.length>0)r=r.concat(flattenCategories(n.children,fn));else r.push({id:n.categoryId,name:fn,shortName:n.categoryName});});return r;
}

function loadCategories(){
    $.ajax({url:'/api/v1/product/category/list',type:'GET',headers:H(),success:function(res){
        if(res.code===200){var tree=res.data||[];allLeafCategories=flattenCategories(tree,'');
        var $f=$('#filterCategory').html('<option value="">全部分类</option>');
        tree.forEach(function(t){$f.append('<option value="'+t.categoryId+'">'+t.categoryName+'</option>');(t.children||[]).forEach(function(c){$f.append('<option value="'+c.categoryId+'">&nbsp;&nbsp;'+c.categoryName+'</option>');});});
        var $a=$('#addCategoryId').html('<option value="">请选择分类</option>');allLeafCategories.forEach(function(c){$a.append('<option value="'+c.id+'">'+c.name+'</option>');});
    }}});
}

function loadProducts(page){
    currentPage=page||1;var kw=$.trim($('#globalSearch').val()),cat=$('#filterCategory').val(),st=$('#filterStatus').val();
    var p={pageNum:currentPage,pageSize:10};if(kw)p.keyword=kw;if(cat)p.categoryId=cat;if(st!=='')p.isOnSale=st;
    $('#productTableBody').html('<tr class="loading-row"><td colspan="11"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>');
    $.ajax({url:'/api/v1/product/list',type:'GET',headers:H(),data:p,
        success:function(r){if(r.code!==200){$('#productTableBody').html('<tr class="loading-row"><td colspan="11" style="color:#ef4444;">'+(r.msg||'加载失败')+'</td></tr>');return;}totalPages=r.data.pages||1;renderProducts(r.data.records||[],r.data.total||0);renderPagination(r.data.total||0);},
        error:function(){$('#productTableBody').html('<tr class="loading-row"><td colspan="11" style="color:#ef4444;">加载失败</td></tr>');}
    });
}

function renderProducts(recs,total){
    if(!recs.length){$('#productTableBody').html('<tr class="loading-row"><td colspan="11">暂无商品数据</td></tr>');return;}
    var h='';recs.forEach(function(p){
        var img=p.mainImage?'<img src="'+p.mainImage+'" style="width:80px;height:56px;object-fit:cover;border-radius:4px;" onerror="this.src=\'../../images/basic/no-image.png\'">':'<div style="width:80px;height:56px;background:#f3f4f6;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:12px;">无图</div>';
        var cat=(p.parentCategoryName?p.parentCategoryName+' > ':'')+(p.categoryName||'-');
        var pr='-';if(p.minPrice!=null)pr=p.minPrice===p.maxPrice?'¥'+Number(p.minPrice).toFixed(2):'¥'+Number(p.minPrice).toFixed(2)+'~'+Number(p.maxPrice).toFixed(2);
        var st=p.isOnSale===1?'<span class="tag tag-on" style="min-width:64px;">已上架</span>':'<span class="tag tag-off" style="min-width:64px;">未上架</span>';
        var tb=p.isOnSale===1?'<button class="btn btn-del btn-toggle" style="width:60px;" data-id="'+p.productId+'" data-status="0">下架</button>':'<button class="btn btn-edit btn-toggle" style="width:60px;background:#fef3c7;color:#d48806;" data-id="'+p.productId+'" data-status="1">上架</button>';
        h+='<tr><td>'+p.productId+'</td><td>'+img+'</td><td style="font-weight:600;">'+esc(p.productName||'-')+'</td><td>'+esc(cat)+'</td><td>'+esc(p.brand||'-')+'</td><td>'+(p.specCount||0)+'</td><td>'+pr+'</td><td>'+(p.totalStock!=null?p.totalStock:'-')+'</td><td>'+st+'</td><td style="font-size:12px;color:#6b7280;">'+fmtTime(p.createTime)+'</td><td class="ops"><button class="btn btn-edit btn-view" style="width:60px;" data-id="'+p.productId+'">详情</button>'+tb+'</td></tr>';
    });$('#productTableBody').html(h);
}

function renderPagination(total){
    var $p=$('#pagination');if(totalPages<=1){$p.html('<span style="color:#6b7280;font-size:13px;">共 '+total+' 条</span>');return;}
    var h='<span style="color:#6b7280;font-size:13px;margin-right:12px;">共 '+total+' 条</span><button class="page-btn" id="prevPage" '+(currentPage<=1?'disabled':'')+'>上一页</button>';
    var s=Math.max(1,currentPage-2),e=Math.min(totalPages,s+4);if(e-s<4)s=Math.max(1,e-4);
    for(var i=s;i<=e;i++)h+='<button class="page-btn '+(i===currentPage?'active':'')+'" data-page="'+i+'">'+i+'</button>';
    h+='<button class="page-btn" id="nextPage" '+(currentPage>=totalPages?'disabled':'')+'>下一页</button>';$p.html(h);
}

function addProduct(){
    var n=$.trim($('#addProductName').val()),c=$('#addCategoryId').val();if(!n){alert('请输入商品名称');return;}if(!c){alert('请选择商品分类');return;}
    $.ajax({url:'/api/v1/product/add',type:'POST',headers:HJ(),data:JSON.stringify({productName:n,categoryId:parseInt(c),brand:$.trim($('#addBrand').val())||null,model:$.trim($('#addModel').val())||null,description:$.trim($('#addDescription').val())||null,isOnSale:parseInt($('#addIsOnSale').val()),createUser:loginUser.userId||null}),
        success:function(r){if(r.code===200){alert('新增商品成功！');$('#modalAdd').removeClass('show');loadProducts(1);}else alert('新增失败：'+r.msg);},error:function(){alert('请求失败');}});
}

function toggleStatus(id,st){if(!confirm(st===1?'确认上架？':'确认下架？'))return;$.ajax({url:'/api/v1/product/status/'+id,type:'PUT',headers:H(),data:{isOnSale:st},success:function(r){if(r.code===200)loadProducts(currentPage);else alert('操作失败：'+r.msg);},error:function(){alert('操作失败');}});}

function viewDetail(id){
    $.ajax({url:'/api/v1/product/detail/'+id,type:'GET',headers:H(),success:function(r){
        if(r.code!==200){alert(r.msg);return;}var d=r.data,p=d.product,sp=d.specs||[],im=d.images||[];
        var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;"><div><b>名称：</b>'+esc(p.productName||'-')+'</div><div><b>品牌：</b>'+esc(p.brand||'-')+'</div><div><b>型号：</b>'+esc(p.model||'-')+'</div><div><b>状态：</b>'+(p.isOnSale===1?'<span class="tag tag-on">已上架</span>':'<span class="tag tag-off">未上架</span>')+'</div></div>';
        if(p.description)h+='<div style="margin-bottom:12px;"><b>描述：</b>'+esc(p.description)+'</div>';
        if(sp.length){h+='<div style="margin-bottom:8px;font-weight:600;">规格列表</div><table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px;"><thead><tr style="background:#f9fafb;"><th style="padding:8px;text-align:left;">编码</th><th>材质</th><th>规格</th><th>单价</th><th>库存</th><th>单位</th></tr></thead><tbody>';sp.forEach(function(s){h+='<tr style="border-bottom:1px solid #f0f3f9;"><td style="padding:8px;">'+(s.specCode||'-')+'</td><td>'+(s.material||'-')+'</td><td>'+(s.size||'-')+'</td><td>¥'+(s.unitPrice||0)+'</td><td>'+(s.stockQuantity||0)+'</td><td>'+(s.unit||'-')+'</td></tr>';});h+='</tbody></table>';}
        if(im.length){h+='<div style="margin-bottom:8px;font-weight:600;">商品图片</div><div style="display:flex;gap:8px;flex-wrap:wrap;">';im.forEach(function(i){h+='<img src="'+i.imageUrl+'" style="width:80px;height:64px;object-fit:cover;border-radius:4px;" onerror="this.style.display=\'none\'">';});h+='</div>';}
        $('#detailContent').html(h);$('#modalDetail').addClass('show');
    },error:function(){alert('加载详情失败');}});
}

// 全局搜索
var searchTimer=null;
$('#globalSearch').on('input',function(){var kw=$.trim($(this).val());if(!kw){$('#searchDropdown').removeClass('show').empty();return;}clearTimeout(searchTimer);searchTimer=setTimeout(function(){doSearch(kw);},300);});
$('#globalSearch').on('keypress',function(e){if(e.which===13)loadProducts(1);});

function doSearch(kw){
    var $d=$('#searchDropdown');$d.html('<div class="sd-empty"><i class="fas fa-spinner fa-spin"></i> 搜索中...</div>').addClass('show');
    var p1=$.ajax({url:'/api/v1/order/list',type:'GET',headers:H(),data:{pageNum:1,pageSize:3,keyword:kw}});
    var p2=$.ajax({url:'/api/v1/product/list',type:'GET',headers:H(),data:{pageNum:1,pageSize:3,keyword:kw}});
    var p3=$.ajax({url:'/api/v1/inventory/stock/list',type:'GET',headers:H(),data:{pageNum:1,pageSize:3,keyword:kw}});
    $.when(p1,p2,p3).done(function(r1,r2,r3){
        var h='',has=false;
        var os=(r1[0].code===200&&r1[0].data.records)?r1[0].data.records:[];
        if(os.length){has=true;h+='<div class="sd-group-title"><i class="fas fa-shopping-cart" style="margin-right:6px;"></i>订单</div>';os.forEach(function(o){h+='<div class="sd-item" onclick="window.location.href=\'order_manager.html\'"><span><b>'+esc(o.orderId)+'</b> - '+esc(o.receiverName||'')+'</span><span class="sd-tag" style="background:#fff7ed;color:#ea580c;">¥'+Number(o.orderAmount||0).toFixed(2)+'</span></div>';});}
        var ps=(r2[0].code===200&&r2[0].data.records)?r2[0].data.records:[];
        if(ps.length){has=true;h+='<div class="sd-group-title"><i class="fas fa-box" style="margin-right:6px;"></i>商品</div>';ps.forEach(function(p){h+='<div class="sd-item" onclick="window.location.href=\'product_manager.html\'"><span><b>'+esc(p.productName)+'</b>'+(p.brand?' - '+esc(p.brand):'')+'</span><span class="sd-tag" style="background:'+(p.isOnSale===1?'#d1fae5;color:#065f46':'#f3f4f6;color:#6b7280')+'">'+(p.isOnSale===1?'已上架':'未上架')+'</span></div>';});}
        var ss=(r3[0].code===200&&r3[0].data.records)?r3[0].data.records:[];
        if(ss.length){has=true;h+='<div class="sd-group-title"><i class="fas fa-warehouse" style="margin-right:6px;"></i>库存</div>';ss.forEach(function(s){var ws=s.isWarning?'background:#fef2f2;color:#dc2626;':'background:#d1fae5;color:#065f46;';h+='<div class="sd-item" onclick="window.location.href=\'inventory_manager.html\'"><span><b>'+esc(s.specCode||'-')+'</b> - '+esc(s.productName||'-')+'</span><span class="sd-tag" style="'+ws+'">库存:'+s.stockQuantity+'</span></div>';});}
        if(!has)h='<div class="sd-empty">未找到相关结果</div>';$d.html(h);
    }).fail(function(){$d.html('<div class="sd-empty" style="color:#ef4444;">搜索失败</div>');});
}
$(document).on('click',function(e){if(!$(e.target).closest('.search-wrap').length)$('#searchDropdown').removeClass('show');});

$(function(){
    loadAdminInfo();loadCategories();loadProducts(1);
    $('#btnFilter').click(function(){loadProducts(1);});
    $('#btnReset').click(function(){$('#globalSearch').val('');$('#filterCategory').val('');$('#filterStatus').val('');loadProducts(1);});
    $('#btnAdd').click(function(){$('#addProductName,#addBrand,#addModel,#addDescription').val('');$('#addCategoryId').val('');$('#addIsOnSale').val('1');$('#modalAdd').addClass('show');});
    $('#btnCancelAdd').click(function(){$('#modalAdd').removeClass('show');});
    $('#btnConfirmAdd').click(addProduct);
    $('#btnCloseDetail').click(function(){$('#modalDetail').removeClass('show');});
    $('#productTableBody').on('click','.btn-toggle',function(){toggleStatus($(this).data('id'),$(this).data('status'));});
    $('#productTableBody').on('click','.btn-view',function(){viewDetail($(this).data('id'));});
    $('#pagination').on('click','.page-btn',function(){if($(this).prop('disabled'))return;if($(this).attr('id')==='prevPage')loadProducts(currentPage-1);else if($(this).attr('id')==='nextPage')loadProducts(currentPage+1);else loadProducts(parseInt($(this).data('page')));});
    $('.modal-overlay').click(function(e){if($(e.target).hasClass('modal-overlay'))$(this).removeClass('show');});
});
</script>
</body>
</html>
