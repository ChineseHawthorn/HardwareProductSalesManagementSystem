<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五金产品销售管理系统 - 店员端</title>
    <link rel="icon" href="../../images/basic/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/console.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>(function(){var u;try{u=JSON.parse(localStorage.getItem('loginUser')||'{}');}catch(e){u={};}if(!u.token||u.roleId!==1){window.location.href='../../index.html';}}());</script>
    <style>
        .stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
        .stat-card{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .15s,box-shadow .15s}
        .stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.1)}
        .stat-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
        .stat-icon.orange{background:#fff7ed;color:#ea580c}
        .stat-icon.red{background:#fef2f2;color:#dc2626}
        .stat-icon.blue{background:#eff6ff;color:#2563eb}
        .stat-info h3{font-size:26px;font-weight:700;color:#111827;margin:0;line-height:1.2}
        .stat-info p{font-size:13px;color:#6b7280;margin:2px 0 0}
        .loading-row td{text-align:center;color:#9ca3af;padding:32px}
        .pagination{padding:12px 16px;text-align:right}
        .page-btn{min-width:30px;height:30px;padding:0 6px;border-radius:6px;border:1px solid #e5eaf3;background:#fff;cursor:pointer;font-size:12px;margin:0 2px}
        .page-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
        .page-btn:disabled{opacity:.5;cursor:not-allowed}
        /* 搜索下拉 */
        .search-wrap{position:relative}
        .search-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50;max-height:360px;overflow-y:auto;margin-top:4px}
        .search-dropdown.show{display:block}
        .sd-group-title{padding:8px 14px;font-size:12px;font-weight:600;color:#6b7280;background:#f9fafb;border-bottom:1px solid #f3f4f6}
        .sd-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f8f9fb;display:flex;justify-content:space-between;align-items:center}
        .sd-item:hover{background:#f0f9ff}
        .sd-item:last-child{border-bottom:none}
        .sd-empty{padding:20px;text-align:center;color:#9ca3af;font-size:13px}
        .sd-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
    </style>
</head>
<body>
<div class="layout">
    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <div class="brand">
            <div class="brand-title">五金产品销售管理系统</div>
            <div class="brand-sub">店员端</div>
        </div>
        <div class="nav">
            <a href="staff_console.html" class="nav-item active"><i class="fas fa-tachometer-alt nav-ico"></i><span class="nav-text">控制台首页</span></a>
            <a href="product_manager.html" class="nav-item"><i class="fas fa-box nav-ico"></i><span class="nav-text">商品管理</span></a>
            <a href="inventory_manager.html" class="nav-item"><i class="fas fa-warehouse nav-ico"></i><span class="nav-text">库存管理</span></a>
            <a href="order_manager.html" class="nav-item"><i class="fas fa-shopping-cart nav-ico"></i><span class="nav-text">订单管理</span></a>
            <a href="feedback_manager.html" class="nav-item"><i class="fas fa-comments nav-ico"></i><span class="nav-text">反馈管理</span></a>
        </div>
    </div>

    <!-- 右侧主体内容 -->
    <div class="main">
        <!-- 顶部栏 -->
        <div class="topbar">
            <h1 class="page-title">控制台首页</h1>
            <div class="topbar-right">
                <div class="search search-wrap">
                    <input type="text" id="globalSearch" placeholder="搜索订单号、商品名称、规格编码..." autocomplete="off">
                    <div class="search-dropdown" id="searchDropdown"></div>
                </div>
                <a href="staff_profile.html" class="user-info" style="text-decoration:none;color:inherit;cursor:pointer;" title="个人信息">
                    <span id="adminName" style="margin-right: 10px;">员工</span>
                    <img id="adminAvatar" src="../../images/avatar/default.png" alt="头像" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                </a>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content">
            <!-- 统计卡片 -->
            <div class="stat-cards">
                <div class="stat-card" onclick="window.location.href='order_manager.html'">
                    <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
                    <div class="stat-info">
                        <h3 id="pendingOrderCount">-</h3>
                        <p>待处理订单</p>
                    </div>
                </div>
                <div class="stat-card" onclick="window.location.href='inventory_manager.html'">
                    <div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="stat-info">
                        <h3 id="warningStockCount">-</h3>
                        <p>库存预警</p>
                    </div>
                </div>
                <div class="stat-card" onclick="window.location.href='feedback_manager.html'">
                    <div class="stat-icon blue"><i class="fas fa-comment-dots"></i></div>
                    <div class="stat-info">
                        <h3 id="unrepliedFbCount">-</h3>
                        <p>未回复反馈</p>
                    </div>
                </div>
            </div>

            <!-- 待处理订单面板 -->
            <div class="panel">
                <div class="toolbar">
                    <h2 style="margin:0;font-size:16px;font-weight:700;">
                        <i class="fas fa-clock" style="color:#ea580c;margin-right:6px;"></i>待处理订单
                    </h2>
                    <a href="order_manager.html" class="btn btn-primary"><i class="fas fa-list btn-ico"></i> 查看全部</a>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr>
                            <th>订单号</th><th>收货人</th><th>订单金额</th>
                            <th>交易类型</th><th>支付状态</th><th>下单时间</th><th>操作</th>
                        </tr></thead>
                        <tbody id="pendingOrderTbody">
                            <tr class="loading-row"><td colspan="7"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 库存预警面板 -->
            <div class="panel">
                <div class="toolbar">
                    <h2 style="margin:0;font-size:16px;font-weight:700;">
                        <i class="fas fa-exclamation-triangle" style="color:#dc2626;margin-right:6px;"></i>库存预警商品
                    </h2>
                    <a href="inventory_manager.html" class="btn btn-primary"><i class="fas fa-warehouse btn-ico"></i> 库存管理</a>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr>
                            <th>规格编码</th><th>商品名称</th><th>规格</th>
                            <th>当前库存</th><th>预警阈值</th><th>操作</th>
                        </tr></thead>
                        <tbody id="warningStockTbody">
                            <tr class="loading-row"><td colspan="6"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 未回复反馈面板 -->
            <div class="panel">
                <div class="toolbar">
                    <h2 style="margin:0;font-size:16px;font-weight:700;">
                        <i class="fas fa-comment-dots" style="color:#2563eb;margin-right:6px;"></i>未回复反馈
                    </h2>
                    <a href="feedback_manager.html" class="btn btn-primary"><i class="fas fa-comments btn-ico"></i> 反馈管理</a>
                </div>
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr>
                            <th>标题</th><th>用户</th><th>内容摘要</th>
                            <th>提交时间</th><th>操作</th>
                        </tr></thead>
                        <tbody id="unrepliedFbTbody">
                            <tr class="loading-row"><td colspan="5"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../../js/jquery-3.7.1.min.js"></script>
<script>
var loginUser = {};
try { loginUser = JSON.parse(localStorage.getItem('loginUser') || '{}'); } catch(e) {}
var TOKEN = loginUser.token || '';

function H() { return { 'Authorization': 'Bearer ' + TOKEN }; }

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(t) {
    if (!t) return '-';
    return new Date(t).toLocaleString('zh-CN',{hour12:false}).replace(/\//g,'-');
}

// ========== 顶栏用户信息 ==========
function loadAdminInfo() {
    $('#adminName').text(loginUser.username || '员工');
    var av = loginUser.avatar || '';
    if (av.startsWith('./')) av = av.replace('./', '../../');
    if (av) $('#adminAvatar').attr('src', av);
}

// ========== 加载待处理订单（待支付+待发货） ==========
function loadPendingOrders() {
    // 加载待支付
    var p0 = $.ajax({ url: '/api/v1/order/list', type: 'GET', headers: H(), data: { pageNum:1, pageSize:5, payStatus:0 }});
    // 加载待发货
    var p4 = $.ajax({ url: '/api/v1/order/list', type: 'GET', headers: H(), data: { pageNum:1, pageSize:5, payStatus:4 }});

    $.when(p0, p4).done(function(r0, r4) {
        var orders = [];
        var count = 0;
        if (r0[0].code === 200) {
            orders = orders.concat(r0[0].data.records || []);
            count += r0[0].data.total || 0;
        }
        if (r4[0].code === 200) {
            orders = orders.concat(r4[0].data.records || []);
            count += r4[0].data.total || 0;
        }
        $('#pendingOrderCount').text(count);

        // 按时间排序取前5条
        orders.sort(function(a,b){ return new Date(b.createTime) - new Date(a.createTime); });
        orders = orders.slice(0, 5);
        renderPendingOrders(orders);
    }).fail(function() {
        $('#pendingOrderTbody').html('<tr class="loading-row"><td colspan="7" style="color:#ef4444;">加载失败</td></tr>');
        $('#pendingOrderCount').text('0');
    });
}

var STATUS_TAG = {
    0:'<span class="tag tag-wait">待支付</span>',
    4:'<span class="tag tag-wait" style="background:#e0f2fe;color:#0284c7;">待发货</span>'
};
var TRADE_TYPE = {1:'批发', 2:'零售'};

function renderPendingOrders(orders) {
    if (!orders.length) {
        $('#pendingOrderTbody').html('<tr class="loading-row"><td colspan="7" style="color:#10b981;"><i class="fas fa-check-circle" style="margin-right:6px;"></i>暂无待处理订单</td></tr>');
        return;
    }
    var h = '';
    orders.forEach(function(o) {
        var ops = '<a href="order_manager.html" class="btn btn-edit" style="width:65px; font-size: 13px; text-align: center; line-height: normal;">处理</a>';
        h += '<tr>' +
            '<td style="font-size:12px;font-weight:600;">' + esc(o.orderId||'-') + '</td>' +
            '<td>' + esc(o.receiverName||'-') + '</td>' +
            '<td style="font-weight:700;">¥' + Number(o.orderAmount||0).toFixed(2) + '</td>' +
            '<td>' + esc(TRADE_TYPE[o.tradeType]||'-') + '</td>' +
            '<td>' + (STATUS_TAG[o.payStatus]||'') + '</td>' +
            '<td style="font-size:12px;color:#6b7280;">' + fmtTime(o.createTime) + '</td>' +
            '<td class="ops">' + ops + '</td>' +
        '</tr>';
    });
    $('#pendingOrderTbody').html(h);
}

// ========== 加载库存预警 ==========
function loadWarningStock() {
    $.ajax({
        url: '/api/v1/inventory/stock/list', type: 'GET', headers: H(),
        data: { pageNum:1, pageSize:5, warnOnly:true },
        success: function(r) {
            if (r.code !== 200) {
                $('#warningStockTbody').html('<tr class="loading-row"><td colspan="6" style="color:#ef4444;">加载失败</td></tr>');
                return;
            }
            var recs = r.data.records || [];
            var total = r.data.total || 0;
            $('#warningStockCount').text(total);
            renderWarningStock(recs);
        },
        error: function() {
            $('#warningStockTbody').html('<tr class="loading-row"><td colspan="6" style="color:#ef4444;">加载失败</td></tr>');
            $('#warningStockCount').text('0');
        }
    });
}

function renderWarningStock(recs) {
    if (!recs.length) {
        $('#warningStockTbody').html('<tr class="loading-row"><td colspan="6" style="color:#10b981;"><i class="fas fa-check-circle" style="margin-right:6px;"></i>库存充足，无预警商品</td></tr>');
        return;
    }
    var h = '';
    recs.forEach(function(r) {
        h += '<tr>' +
            '<td style="font-size:12px;color:#6b7280;">' + esc(r.specCode||'-') + '</td>' +
            '<td style="font-weight:600;">' + esc(r.productName||'-') + '</td>' +
            '<td>' + esc((r.material||'')+' '+(r.size||'')) + '</td>' +
            '<td style="font-weight:700;color:#dc2626;">' + (r.stockQuantity!=null?r.stockQuantity:'-') + '</td>' +
            '<td>' + (r.warningThreshold!=null?r.warningThreshold:'-') + '</td>' +
            '<td class="ops"><a href="inventory_manager.html" class="btn btn-edit" style="width:44px;">补货</a></td>' +
        '</tr>';
    });
    $('#warningStockTbody').html(h);
}

// ========== 加载未回复反馈 ==========
function loadUnrepliedFeedback() {
    $.ajax({
        url: '/api/v1/feedback/list', type: 'GET', headers: H(),
        data: { pageNum:1, pageSize:5, status:0 },
        success: function(r) {
            if (r.code !== 200) {
                $('#unrepliedFbTbody').html('<tr class="loading-row"><td colspan="5" style="color:#ef4444;">加载失败</td></tr>');
                return;
            }
            var recs = r.data.records || [];
            var total = r.data.total || 0;
            $('#unrepliedFbCount').text(total);
            renderUnrepliedFb(recs);
        },
        error: function() {
            $('#unrepliedFbTbody').html('<tr class="loading-row"><td colspan="5" style="color:#ef4444;">加载失败</td></tr>');
            $('#unrepliedFbCount').text('0');
        }
    });
}

function renderUnrepliedFb(recs) {
    if (!recs.length) {
        $('#unrepliedFbTbody').html('<tr class="loading-row"><td colspan="5" style="color:#10b981;"><i class="fas fa-check-circle" style="margin-right:6px;"></i>所有反馈均已回复</td></tr>');
        return;
    }
    var h = '';
    recs.forEach(function(fb) {
        var preview = (fb.content||'').substring(0, 30);
        if ((fb.content||'').length > 30) preview += '...';
        h += '<tr>' +
            '<td style="font-weight:600;">' + esc(fb.title||'(无标题)') + '</td>' +
            '<td>' + esc(fb.username||'匿名') + '</td>' +
            '<td style="color:#6b7280;font-size:13px;">' + esc(preview) + '</td>' +
            '<td style="font-size:12px;color:#6b7280;">' + fmtTime(fb.createTime) + '</td>' +
            '<td class="ops"><a href="feedback_manager.html" class="btn btn-edit" style="width:44px;">回复</a></td>' +
        '</tr>';
    });
    $('#unrepliedFbTbody').html(h);
}

// ========== 全局搜索 ==========
var searchTimer = null;
$('#globalSearch').on('input', function() {
    var kw = $.trim($(this).val());
    if (!kw) { $('#searchDropdown').removeClass('show').empty(); return; }
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){ doGlobalSearch(kw); }, 300);
});

$('#globalSearch').on('keypress', function(e) {
    if (e.which === 13) {
        var kw = $.trim($(this).val());
        if (kw) {
            // 回车默认跳转订单管理搜索
            window.location.href = 'order_manager.html?search=' + encodeURIComponent(kw);
        }
    }
});

function doGlobalSearch(kw) {
    var $drop = $('#searchDropdown');
    $drop.html('<div class="sd-empty"><i class="fas fa-spinner fa-spin"></i> 搜索中...</div>').addClass('show');

    // 并行搜索订单、商品、库存
    var pOrder = $.ajax({ url:'/api/v1/order/list', type:'GET', headers:H(), data:{pageNum:1,pageSize:3,keyword:kw} });
    var pProduct = $.ajax({ url:'/api/v1/product/list', type:'GET', headers:H(), data:{pageNum:1,pageSize:3,keyword:kw} });
    var pStock = $.ajax({ url:'/api/v1/inventory/stock/list', type:'GET', headers:H(), data:{pageNum:1,pageSize:3,keyword:kw} });

    $.when(pOrder, pProduct, pStock).done(function(rO, rP, rS) {
        var html = '';
        var hasResults = false;

        // 订单结果
        var orders = (rO[0].code===200 && rO[0].data.records) ? rO[0].data.records : [];
        if (orders.length) {
            hasResults = true;
            html += '<div class="sd-group-title"><i class="fas fa-shopping-cart" style="margin-right:6px;"></i>订单</div>';
            orders.forEach(function(o) {
                html += '<div class="sd-item" onclick="window.location.href=\'order_manager.html\'">' +
                    '<span><b>' + esc(o.orderId) + '</b> - ' + esc(o.receiverName||'') + '</span>' +
                    '<span class="sd-tag" style="background:#fff7ed;color:#ea580c;">¥'+Number(o.orderAmount||0).toFixed(2)+'</span>' +
                '</div>';
            });
        }

        // 商品结果
        var products = (rP[0].code===200 && rP[0].data.records) ? rP[0].data.records : [];
        if (products.length) {
            hasResults = true;
            html += '<div class="sd-group-title"><i class="fas fa-box" style="margin-right:6px;"></i>商品</div>';
            products.forEach(function(p) {
                html += '<div class="sd-item" onclick="window.location.href=\'product_manager.html\'">' +
                    '<span><b>' + esc(p.productName) + '</b>' + (p.brand ? ' - '+esc(p.brand) : '') + '</span>' +
                    '<span class="sd-tag" style="background:'+(p.isOnSale===1?'#d1fae5;color:#065f46':'#f3f4f6;color:#6b7280')+'">'+(p.isOnSale===1?'已上架':'未上架')+'</span>' +
                '</div>';
            });
        }

        // 库存结果
        var stocks = (rS[0].code===200 && rS[0].data.records) ? rS[0].data.records : [];
        if (stocks.length) {
            hasResults = true;
            html += '<div class="sd-group-title"><i class="fas fa-warehouse" style="margin-right:6px;"></i>库存</div>';
            stocks.forEach(function(s) {
                var warnStyle = s.isWarning ? 'background:#fef2f2;color:#dc2626;' : 'background:#d1fae5;color:#065f46;';
                html += '<div class="sd-item" onclick="window.location.href=\'inventory_manager.html\'">' +
                    '<span><b>' + esc(s.specCode||'-') + '</b> - ' + esc(s.productName||'-') + '</span>' +
                    '<span class="sd-tag" style="'+warnStyle+'">库存:'+s.stockQuantity+'</span>' +
                '</div>';
            });
        }

        if (!hasResults) {
            html = '<div class="sd-empty">未找到相关结果</div>';
        }

        $drop.html(html);
    }).fail(function() {
        $drop.html('<div class="sd-empty" style="color:#ef4444;">搜索失败，请重试</div>');
    });
}

// 点击外部关闭搜索下拉
$(document).on('click', function(e) {
    if (!$(e.target).closest('.search-wrap').length) {
        $('#searchDropdown').removeClass('show');
    }
});

// ========== 初始化 ==========
$(function() {
    loadAdminInfo();
    loadPendingOrders();
    loadWarningStock();
    loadUnrepliedFeedback();
});
</script>
</body>
</html>
